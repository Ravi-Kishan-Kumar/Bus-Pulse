name: bus-pulse

services:
  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The local demo continuously emits synthetic data. Keep the broker
      # bounded without affecting the live dashboard, which reads current
      # positions from TimescaleDB.
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
      KAFKA_LOG_INDEX_SIZE_MAX_BYTES: 1048576
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-1}
    volumes:
      - ./data/runtime/kafka:/tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  init-kafka:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in vehicle-telemetry passenger-flow occupancy-state predictions alerts; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1 --config retention.ms=${KAFKA_TOPIC_RETENTION_MS:-3600000}
        done
        for topic in dead control; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1 --config retention.ms=${KAFKA_TOPIC_RETENTION_MS:-3600000}
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic control-acks --partitions 1 --replication-factor 1 --config retention.ms=${KAFKA_TOPIC_RETENTION_MS:-3600000}
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic spark-spike-state --partitions 1 --replication-factor 1 --config retention.ms=3600000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  timescaledb:
    image: timescale/timescaledb:2.30.2-pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ridesense}
      POSTGRES_USER: ${POSTGRES_USER:-ridesense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/runtime/timescaledb:/var/lib/postgresql/data
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  init-data:
    build:
      context: .
      dockerfile: docker/init.Dockerfile
    depends_on:
      timescaledb:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ridesense}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-ridesense}
    restart: "no"

  simulator:
    build:
      context: .
      dockerfile: docker/simulator.Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      init-data:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      NETWORK_PATH: /app/data/blr/network_all.json.gz
      FLEET_CONFIG: /app/config/sim_fleet.yaml
      DATABASE_URL: postgresql://${POSTGRES_USER:-ridesense}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-ridesense}
      BEAT_S: ${BEAT_S:-30}
      SIM_SPEEDUP: ${SIM_SPEEDUP:-1}
      SEED: ${SEED:-42}
      MAX_SIM_BUSES: ${MAX_SIM_BUSES:-4000}
      BUS_CAPACITY: ${BUS_CAPACITY:-70}
      SEAT_CAPACITY: ${SEAT_CAPACITY:-40}
      STAND_CAPACITY: ${STAND_CAPACITY:-30}
      HANDHOLD_CAPACITY: ${HANDHOLD_CAPACITY:-30}
      DEMAND_SCALE: ${DEMAND_SCALE:-1.0}
      SIM_START_LOCAL: ${SIM_START_LOCAL:-now}
    restart: unless-stopped

  processor:
    build:
      context: .
      dockerfile: docker/processor.Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      init-data:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DATABASE_URL: postgresql://${POSTGRES_USER:-ridesense}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-ridesense}
      CHECKPOINT_DIR: ${CHECKPOINT_DIR:-/app/checkpoints/live-v2}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}
      ALLOWED_LATENESS_SECONDS: ${ALLOWED_LATENESS_SECONDS:-15}
      OVERCROWD_THRESHOLD_PCT: ${OVERCROWD_THRESHOLD_PCT:-85}
      SPARK_MASTER: ${SPARK_MASTER:-local[4]}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-3}
      TRIGGER_INTERVAL: ${TRIGGER_INTERVAL:-1 second}
    volumes:
      - ./data/runtime/spark-checkpoints:/app/checkpoints
      - ./models:/app/models
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      init-data:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ridesense}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-ridesense}
      KAFKA_BOOTSTRAP: kafka:9092
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_SIM_BUSES: ${MAX_SIM_BUSES:-4000}
      BUS_LIVE_TTL_SECONDS: ${BUS_LIVE_TTL_SECONDS:-75}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-15}
    restart: unless-stopped

  ml-train:
    build:
      context: .
      dockerfile: docker/processor.Dockerfile
    profiles: ["tools"]
    depends_on:
      timescaledb:
        condition: service_healthy
      init-data:
        condition: service_completed_successfully
    command: ["python", "-m", "ridesense.ml.train"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ridesense}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:-ridesense}
      MODEL_DIR: /app/models
      ML_REPORT: /app/reports/ml.json
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
    restart: "no"

volumes:
  kafka-data:
  timescale-data:
  spark-checkpoints:
  model-data:
